[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megatrain"
version = "0.1.0"
description = "Generic TensorPlay training core for pretraining, SFT and post-training"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "tensorplay>=1.3.0.dev0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/ohtensorplay/megatrain"
Repository = "https://github.com/ohtensorplay/megatrain"
Issues = "https://github.com/ohtensorplay/megatrain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
