[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megatrain"
version = "0.1.0"
description = "Generic TensorPlay training core for pretraining, SFT and post-training"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "tensorplay>=1.3.0.dev0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    # Pinned: ruff format output is part of the gate, so the version is too.
    "ruff==0.16.8",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
Homepage = "https://github.com/ohtensorplay/megatrain"
Repository = "https://github.com/ohtensorplay/megatrain"
Issues = "https://github.com/ohtensorplay/megatrain/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
# The pinned upstream checkouts under upstream-checkouts/ keep their own configs.
extend-exclude = ["upstream-checkouts", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# megatron_bench.py sets the NVTE/Transformer Engine paths before importing
# torch, so its imports are deliberately not at the top of the file.
"bench/megatron_bench.py" = ["E402"]
